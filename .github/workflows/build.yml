name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Transfer tests
        run: dotnet run --project tests/LanDrop.Tests -c Release

      - name: Build the app
        run: dotnet build src/LanDrop.App -c Release

      - name: Install a virtual screen
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1

      - name: Open the app and take a screenshot
        timeout-minutes: 3
        shell: bash
        run: |
          app="src/LanDrop.App/bin/Release/net9.0/LanDrop.dll"
          shot="screenshot-${{ matrix.name }}.png"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dotnet "$app" --smoke-test --screenshot "$shot"
          else
            dotnet "$app" --smoke-test --screenshot "$shot"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.name }}
          path: screenshot-*.png
          if-no-files-found: ignore

  # Builds the downloads on every push (kept as run files for a few days),
  # and attaches them to a release only when the push is a v* tag.
  package:
    name: Downloads for ${{ matrix.name }}
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: windows }
          - { name: macOS, os: macos-latest, target: macos }
          - { name: Linux, os: ubuntu-latest, target: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build the downloads
        shell: bash
        run: packaging/publish.sh ${{ matrix.target }}

      - name: Check the Mac app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for zip in dist/LanDrop-macOS-*.zip; do
            rm -rf check && mkdir check && ditto -x -k "$zip" check
            app="check/LAN Drop.app"
            codesign --verify --deep --strict "$app"
            plutil -lint "$app/Contents/Info.plist"
            test -x "$app/Contents/MacOS/LanDrop"
            test -f "$app/Contents/Resources/LanDrop.icns"
            lipo -archs "$app/Contents/MacOS/LanDrop"
          done
          # The Apple Silicon build should start on this (Apple Silicon) machine.
          ditto -x -k dist/LanDrop-macOS-AppleSilicon.zip run
          "run/LAN Drop.app/Contents/MacOS/LanDrop" --smoke-test

      - name: Check the Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir run && tar -xzf dist/LanDrop-Linux-x64.tar.gz -C run
          xvfb-run -a run/LanDrop --smoke-test || { sudo apt-get update && sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1 && xvfb-run -a run/LanDrop --smoke-test; }

      - name: Check the Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: ./dist/LanDrop-Windows-x64.exe --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.name }}
          path: dist/*
          retention-days: 7

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "LAN Drop ${TAG#v}" --notes-file packaging/release-notes.md \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/* --clobber
